# Example Nonopelagram Archipelago player YAML.
# For the full, commented option list, use the Launcher's "Generate Template Options".
name: NonopelagramP1
game: Nonopelagram
requires:
  version: 0.6.7

Nonopelagram:
  # Grid sizes / goal
  grid_preset: normal          # easy / normal / hard / evil / expedition_33 / custom

  # Start
  starting_lives: 3            # 1-10
  starting_coins: 5            # 0-50
  starting_hints: 1            # 0-5
  starting_wallet_level: 0     # 0-4 (coin cap tier)

  # Item pool
  coins_per_bundle: normal     # low=5 / normal=50 / high=100 / custom
  # coins_per_bundle_custom: 50  # coins per bundle when coins_per_bundle: custom
  extra_lives_in_pool: 5       # 0-10
  wallets_in_pool: 0           # 0-4  (each becomes a shop check)
  hearts_in_pool: 0            # 0-10 (each becomes a shop check)
  # Hint Reveal / Coin Bundle / Random Cell Solve fillers are distributed
  # automatically across the remaining checks (fixed 10:15:3 ratio).

  # Rules
  require_tier_completion: true
  difficulty_cost: low         # free / low / normal / high / progressive
  flawless_checks: true
  death_link: "off"            # off / on / damage
